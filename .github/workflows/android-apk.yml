name: Build Kimia Warehouse APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'transfer/*.b64'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: kimia-warehouse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kimia 1.1.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore compressed source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s transfer/part-00.b64
          cat transfer/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/kimia-source.tar.xz
          xz --test /tmp/kimia-source.tar.xz
          mkdir -p WarehouseApp
          tar -xJf /tmp/kimia-source.tar.xz -C WarehouseApp
          test -f WarehouseApp/app/build.gradle.kts
          test -f WarehouseApp/settings.gradle.kts
          grep -q 'کیمیا مس تابان کویر' WarehouseApp/app/src/main/res/values/strings.xml
          grep -q 'versionName = "1.1.1"' WarehouseApp/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        working-directory: WarehouseApp
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=WarehouseApp/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimia-warehouse-1.1.1-apk
          path: WarehouseApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
